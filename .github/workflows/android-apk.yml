.github/workflows/android-apk.yml
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git \
            openjdk-17-jdk unzip \
            android-sdk-platform-tools

      - name: Verificar projeto
        run: |
          echo "Arquivos do projeto:"
          ls -la
          echo "Verificando CMakeLists.txt:"
          test -f CMakeLists.txt

      - name: Avisar sobre configuração Android
        run: |
          echo "A verificação terminou."
          echo "A configuração completa do Android ainda precisa ser confirmada.
